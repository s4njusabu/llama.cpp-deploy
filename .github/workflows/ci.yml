name: Test of FastAPI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Clone the repo into the runner
        uses: actions/checkout@v7
      
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      
      - name: Install packages
        run: uv sync --locked

      - name: Ruff check 1
        run: uv run ruff check 
      - name: Ruff check 2
        run: uv run ruff format --check
      
      - name: Pytest
        run: uv run pytest